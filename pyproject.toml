[project]
name = "autointerp-scorers"
version = "0.1.0"
description = "Do autointerp detection scorers agree, and how much does the explanation help them over a placebo?"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "anthropic>=0.40",
  "openai>=1.50",
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "tiktoken>=0.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ipykernel>=6", "ruff>=0.17"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autointerp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
